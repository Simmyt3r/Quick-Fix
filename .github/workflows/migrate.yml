name: Run DB migrations

on:
  workflow_dispatch: {}

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show migration state before upgrading
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLASK_APP: run.py
          SECRET_KEY: unused-for-migrations
        run: |
          echo "--- what the database thinks its current revision is ---"
          flask db current -v || true
          echo "--- what revisions exist in this checkout, and which is head ---"
          flask db heads -v || true
          flask db history || true

      - name: Run flask db upgrade
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLASK_APP: run.py
          SECRET_KEY: unused-for-migrations
        run: flask db upgrade
