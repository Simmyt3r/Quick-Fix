{% extends "base_app.html" %}
{% block title %}Log in — QuickFix Nearby{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to manage your requests or jobs.</p>
    <form method="POST" class="auth-form">
      <label>Email
        <input type="email" name="email" required autofocus value="{{ request.form.get('email', '') }}">
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p class="auth-foot">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
