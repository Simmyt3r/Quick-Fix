{% extends "base_app.html" %}
{% block title %}Set a new password — QuickFix Nearby{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="auth-sub">Choose a new password for your account.</p>

    <form method="POST" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>New password
        <input type="password" name="password" required minlength="8" autofocus>
      </label>
      <label>Confirm new password
        <input type="password" name="confirm_password" required minlength="8">
      </label>
      <button type="submit" class="btn btn-primary">Reset password</button>
    </form>
    <p class="auth-foot"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
  </div>
</div>
{% endblock %}
