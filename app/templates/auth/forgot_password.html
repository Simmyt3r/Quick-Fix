{% extends "base_app.html" %}
{% block title %}Reset your password — QuickFix Nearby{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="auth-sub">Enter the email on your account and we'll send a reset link.</p>

    <form method="POST" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email
        <input type="email" name="email" required autofocus value="{{ request.form.get('email', '') }}">
      </label>
      <button type="submit" class="btn btn-primary">Send reset link</button>
    </form>
    <p class="auth-foot"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
  </div>
</div>
{% endblock %}
